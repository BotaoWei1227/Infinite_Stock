name = "alchemy-exchange"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"

# 網頁（public/）與 API 放在同一個 Worker，同網域，不需要 CORS 設定
[assets]
directory = "./public/"
binding = "ASSETS"
run_worker_first = ["/inject", "/trade", "/ensure-market"]

[vars]
FIREBASE_PROJECT_ID = "infinite-stock-a7d4d"
# 機密 FIREBASE_SA 不寫在這裡，請在 Cloudflare 網頁「Variables and Secrets」新增為 Secret
