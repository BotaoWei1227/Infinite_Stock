name = "alchemy-exchange"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# 網頁（public/）與 API 放在同一個 Worker，同網域，不需要 CORS 設定
[assets]
directory = "./public/"
binding = "ASSETS"
run_worker_first = ["/inject", "/trade", "/bank", "/news", "/odds", "/whoami", "/ensure-market", "/profile", "/leaderboard", "/blackmarket", "/analyst", "/monopoly", "/craft", "/achievements", "/public"]

# 每分鐘檢查預定新聞與每日造物；行情仍每 2 分鐘更新一次（見 Worker 排程判斷）
[triggers]
crons = ["* * * * *"]

[vars]
FIREBASE_PROJECT_ID = "infinite-stock-a7d4d"
# 機密 DEV_EMAILS（開發者信箱，逗號分隔）、GEMINI_API_KEY 請放在 Secret，不要寫進這個公開檔案
# 機密 FIREBASE_SA 不寫在這裡，請在 Cloudflare 網頁「Variables and Secrets」新增為 Secret
