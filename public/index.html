<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>煉金交易所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ticker" class="ticker" hidden role="region" aria-label="財經快訊"></div>
<header class="top">
  <button id="menu" class="px-btn gear" type="button" aria-label="選單" aria-haspopup="dialog">☰</button>
  <h1 class="logo px">煉金<span>交易所</span></h1>
  <div class="top-r"><button id="mode" class="px-btn gear" type="button" aria-label="切換到大富翁">🎲</button><button id="gear" class="px-btn gear" type="button" aria-label="設定">⚙</button></div>
</header>
<main>
  <section id="strip" class="strip" aria-label="帳號與資產"></section>
  <div id="msg" class="term" role="status" aria-live="polite">請先登入 Google 帳號，就能買賣股票與使用銀行</div>

  <div id="v-trade" class="view">
    <p class="note">玩家製作的非官方小遊戲，非《無限煉製》官方活動。遊戲幣無實際價值，不提供任何官方獎勵。</p>
    <p class="rule"></p>
    <section id="shutter" class="win shutter" hidden aria-label="休市中"><div class="bar"><span class="tt">CLOSED.EXE</span></div><div class="shutter-door"><div class="px">休市中</div><p>交易所已拉下鐵捲門</p><p>營業時間：台北時間 09:00–24:00</p><small>每日指定造物會在開盤前準備</small></div></section>
    <section id="craft" class="win" aria-label="背包"></section>
    <div id="market"></div>
    <section class="win" aria-label="全服動態">
      <div class="bar"><span class="tt">📜 LOG.EXE</span><span class="wb dec" aria-hidden="true">_</span><span class="wb dec" aria-hidden="true">×</span></div>
      <div id="feed" class="body log"></div>
    </section>
  </div>
  <div id="v-news" class="view" hidden><div id="nform"></div><div id="nlist"></div></div>
  <div id="v-black" class="view" hidden><section class="win"><div class="bar"><span class="tt">🕶 BLACKMARKET.EXE</span></div><div id="blackmarket" class="body"></div></section></div>
  <div id="v-analyst" class="view" hidden><section class="win"><div class="bar"><span class="tt">📊 STOCK ANALYST.EXE</span></div><div id="analyst" class="body"></div></section></div>
  <div id="v-rank" class="view" hidden><section class="win"><div class="bar"><span class="tt">🏆 富士比排行榜</span></div><div id="ranklist" class="body"></div></section></div>
  <div id="v-mono" class="view" hidden></div>
  <div id="v-bank" class="view" hidden></div>
  <div id="v-work" class="view" hidden></div>
  <div id="v-me" class="view" hidden></div>
  <div id="v-pub" class="view" hidden></div>
  <div id="v-set" class="view" hidden></div>
</main>

<footer class="pixel-office" aria-hidden="true">
  <div class="office-caption">MARKET STREET · 午休時間</div>
  <div class="office-walkway"><span class="office-person person-one"><i>▣</i></span><span class="office-person person-two"><i>▤</i></span><span class="office-person person-three"><i>▣</i></span></div>
</footer>

<dialog id="drawer" class="win drawer" aria-label="選單">
  <div class="bar"><span class="tt">☰ MENU.EXE</span><button id="dclose" class="wb" type="button" aria-label="關閉選單">×</button></div>
  <nav class="body nav" aria-label="主選單">
    <button class="nav-item" type="button" data-v="trade">📈 交易區</button>
    <button class="nav-item" type="button" data-v="mono">🎲 大富翁</button>
    <button class="nav-item" type="button" data-v="me">👤 個人資料</button>
    <button class="nav-item" type="button" data-v="rank">🏆 排行榜</button>
    <button class="nav-item" type="button" data-v="black">🕶 黑市</button>
    <button class="nav-item" type="button" data-v="analyst">📊 股票分析師</button>
    <button class="nav-item" type="button" data-v="news">📰 財經新聞</button>
    <button class="nav-item" type="button" data-v="bank">🏦 銀行</button>
    <button class="nav-item" type="button" data-v="work">⚗ 練金工坊</button>
    <button class="nav-item" type="button" data-v="set">⚙ 設定</button>
  </nav>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
